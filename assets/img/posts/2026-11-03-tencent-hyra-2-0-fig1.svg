<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="sans-serif">
<rect width="800" height="460" fill="#f4f7fa"/>
<text x="400" y="42" font-size="20" font-weight="bold" text-anchor="middle" fill="#10243e">Three tiers, one job</text>
<rect x="80" y="70" width="360" height="90" rx="12" fill="#10243e"/>
<text x="260" y="108" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">OVERALL</text>
<text x="260" y="138" font-size="15" text-anchor="middle" fill="#cfe0f0">sets goals · allocates resources</text>
<rect x="80" y="190" width="360" height="90" rx="12" fill="#0e7c7b"/>
<text x="260" y="228" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">MISSION</text>
<text x="260" y="258" font-size="15" text-anchor="middle" fill="#e0f2f1">owns a research thread</text>
<rect x="80" y="310" width="360" height="90" rx="12" fill="#0e7c7b"/>
<text x="260" y="348" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">WORKER</text>
<text x="260" y="378" font-size="15" text-anchor="middle" fill="#e0f2f1">runs experiments in parallel</text>
<rect x="520" y="190" width="220" height="90" rx="12" fill="#f0a13a"/>
<text x="630" y="228" font-size="18" font-weight="bold" text-anchor="middle" fill="#10243e">BOOKS</text>
<text x="630" y="258" font-size="15" text-anchor="middle" fill="#10243e">lessons become skills</text>
<line x1="260" y1="160" x2="260" y2="190" stroke="#10243e" stroke-width="4"/>
<line x1="260" y1="280" x2="260" y2="310" stroke="#10243e" stroke-width="4"/>
<line x1="440" y1="355" x2="520" y2="260" stroke="#f0a13a" stroke-width="4"/>
<line x1="520" y1="210" x2="440" y2="210" stroke="#f0a13a" stroke-width="4"/>
<text x="400" y="435" font-size="16" text-anchor="middle" fill="#10243e">Lessons stored — and returned as skills</text>
</svg>