<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif">
<text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">L'examen : entraînement, figement, puis un seul essai sur 2024</text>
<rect x="15" y="58" width="300" height="186" rx="10" fill="#e8f0fa" stroke="#2f5d8a" stroke-width="2"/>
<text x="165" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">2022–2023 — RECHERCHE</text>
<text x="165" y="128" text-anchor="middle" font-size="16" fill="#22303f">Écrire le code, construire</text>
<text x="165" y="156" text-anchor="middle" font-size="16" fill="#22303f">les variables, noter les</text>
<text x="165" y="184" text-anchor="middle" font-size="16" fill="#22303f">3 042 actions chaque jour</text>
<text x="165" y="212" text-anchor="middle" font-size="16" fill="#22303f">5 stratégies candidates au plus</text>
<text x="165" y="240" text-anchor="middle" font-size="16" fill="#22303f">Retour : agrégats seulement</text>
<rect x="350" y="58" width="300" height="186" rx="10" fill="#fdf3e0" stroke="#9a6a14" stroke-width="2"/>
<text x="500" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">FIGEMENT</text>
<text x="500" y="128" text-anchor="middle" font-size="16" fill="#22303f">Une seule stratégie retenue</text>
<text x="500" y="156" text-anchor="middle" font-size="16" fill="#22303f">Code et environnement</text>
<text x="500" y="184" text-anchor="middle" font-size="16" fill="#22303f">verrouillés</text>
<text x="500" y="212" text-anchor="middle" font-size="16" fill="#22303f">Plus aucune modification</text>
<rect x="685" y="58" width="300" height="186" rx="10" fill="#e9f6ec" stroke="#2e7d3f" stroke-width="2"/>
<text x="835" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">2024 — SCELLÉE</text>
<text x="835" y="128" text-anchor="middle" font-size="16" fill="#22303f">Un seul passage, sans retour</text>
<text x="835" y="156" text-anchor="middle" font-size="16" fill="#22303f">Les 75 meilleures notes,</text>
<text x="835" y="184" text-anchor="middle" font-size="16" fill="#22303f">équipondérées</text>
<text x="835" y="212" text-anchor="middle" font-size="16" fill="#22303f">Lots de 100 actions ; coûts</text>
<text x="835" y="240" text-anchor="middle" font-size="16" fill="#22303f">et impact de marché facturés</text>
<polygon points="322,138 344,151 322,164" fill="#44586e"/>
<polygon points="657,138 679,151 657,164" fill="#44586e"/>
<rect x="170" y="268" width="660" height="44" rx="22" fill="#16283f"/>
<text x="500" y="297" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Résultat : 0 modèle sur 9 n'a battu le marché équipondéré (+17,1 %)</text>
</svg>
