<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif">
<text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">考试规则：先在 2022–2023 年练手，冻结策略，再对封存的 2024 年只跑一次</text>
<rect x="15" y="58" width="300" height="186" rx="10" fill="#e8f0fa" stroke="#2f5d8a" stroke-width="2"/>
<text x="165" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">2022–2023 · 研究期</text>
<text x="165" y="128" text-anchor="middle" font-size="16" fill="#22303f">自己写代码、构建特征</text>
<text x="165" y="156" text-anchor="middle" font-size="16" fill="#22303f">每天给 3042 只股票打分</text>
<text x="165" y="184" text-anchor="middle" font-size="16" fill="#22303f">最多测试 5 个候选策略</text>
<text x="165" y="212" text-anchor="middle" font-size="16" fill="#22303f">反馈只有汇总数字</text>
<rect x="350" y="58" width="300" height="186" rx="10" fill="#fdf3e0" stroke="#9a6a14" stroke-width="2"/>
<text x="500" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">冻结</text>
<text x="500" y="128" text-anchor="middle" font-size="16" fill="#22303f">选定一个策略</text>
<text x="500" y="156" text-anchor="middle" font-size="16" fill="#22303f">代码与运行环境锁定</text>
<text x="500" y="184" text-anchor="middle" font-size="16" fill="#22303f">此后不许任何修改</text>
<rect x="685" y="58" width="300" height="186" rx="10" fill="#e9f6ec" stroke="#2e7d3f" stroke-width="2"/>
<text x="835" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#16283f">2024 · 封存</text>
<text x="835" y="128" text-anchor="middle" font-size="16" fill="#22303f">只运行一次，无结果回传</text>
<text x="835" y="156" text-anchor="middle" font-size="16" fill="#22303f">持有打分最高的 75 只，等权</text>
<text x="835" y="184" text-anchor="middle" font-size="16" fill="#22303f">100 股整数手买卖</text>
<text x="835" y="212" text-anchor="middle" font-size="16" fill="#22303f">交易成本与市场冲击照算</text>
<polygon points="322,138 344,151 322,164" fill="#44586e"/>
<polygon points="657,138 679,151 657,164" fill="#44586e"/>
<rect x="170" y="268" width="660" height="44" rx="22" fill="#16283f"/>
<text x="500" y="297" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">结果：9 个模型，0 个跑赢等权市场（+17.1%）</text>
</svg>
